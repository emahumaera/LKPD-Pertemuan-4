<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Ringkasan LKPD - Sistem Komputer</title>
<style>
  /* ====== GAYA LAYAR ====== */
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f1f5f9; }
  .page { max-width: 1000px; margin: 0 auto; background: #fff; padding: 24px; }

  /* ====== KUNCI PERBAIKAN CETAK ====== */
  @media print {
    /* 1. Ukuran & margin halaman */
    @page { size: A4 portrait; margin: 12mm 10mm; }

    /* 2. Reset lebar & layout dasar */
    html, body {
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      font-size: 11pt !important;
      display: block !important;      /* flex bikin overflow */
      overflow: visible !important;
    }

    /* 3. Sembunyikan elemen yang tidak perlu dicetak */
    #sidebar, #sidebar-toggle-btn, .lightbox-overlay,
    #btn-prev, #btn-next, .zoom-hint, .fixed, .no-print {
      display: none !important;
    }

    /* 4. Container jangan dibatasi lebar */
    main, .page, .container, .wrapper, section, article {
      margin: 0 !important;
      margin-left: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      padding: 0 !important;
      float: none !important;
      position: static !important;
      transform: none !important;
    }

    /* 5. Matikan overflow-hidden agar tidak terpotong */
    .rounded-3xl, .rounded-2xl, .rounded-xl, .card,
    [class*="overflow"] {
      overflow: visible !important;
    }

    /* 6. Grid jadi 2 kolom di kertas (3 kolom bikin melebar) */
    .grid, .md\:grid-cols-2, .md\:grid-cols-3 {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
    }
    .grid-cols-3 { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }

    /* 7. Tabel tidak boleh melebar keluar halaman */
    table { width: 100% !important; table-layout: fixed; }
    th, td { word-wrap: break-word; overflow-wrap: anywhere; }
    .overflow-x-auto { overflow: visible !important; }

    /* 8. Hindari elemen terbelah antar halaman */
    .card, .device-card, .rounded-3xl, .rounded-2xl,
    table, tr, figure, img {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    h1, h2, h3, h4 { page-break-after: avoid; break-after: avoid; }

    /* 9. Gambar ikut lebar container */
    img { max-width: 100% !important; height: auto !important; }

    /* 10. Cetak warna background & hapus shadow */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      box-shadow: none !important;
      text-shadow: none !important;
    }

    /* 11. Tiap section di halaman baru (opsional) */
    .section {
      display: block !important;
      opacity: 1 !important;
      animation: none !important;
      page-break-after: always;
      break-after: page;
    }
    .section:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Ringkasan LKPD - Sistem Komputer</h1>
    <p>Konten LKPD Anda di sini...</p>
  </div>
</body>
</html>
